name: "Phase 32: Build exact RA72 kernel in native DD-WRT tree"

on:
  workflow_dispatch:
    inputs:
      ddwrt_source_url:
        description: "Public DD-WRT SVN source URL"
        required: true
        default: "svn://svn.dd-wrt.com/DD-WRT"
        type: string
      reference_repository:
        description: "Verified GPL repository containing the current RA72 DTS"
        required: true
        default: "https://github.com/openwrt/openwrt.git"
        type: string
      reference_ref:
        description: "Verified reference branch"
        required: true
        default: "openwrt-25.12"
        type: string

permissions:
  contents: read

jobs:
  build-kernel:
    name: "Phase 32 in-tree DD-WRT ARM64 kernel and RA72 DTB build"
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      DDWRT_SOURCE_URL: ${{ inputs.ddwrt_source_url }}
      REFERENCE_REPOSITORY: ${{ inputs.reference_repository }}
      REFERENCE_REF: ${{ inputs.reference_ref }}

    steps:
      - name: Check out DD-WRT RA72 project
        uses: actions/checkout@v4

      - name: Install native ARM64 kernel build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bc bison build-essential cpio curl device-tree-compiler dwarves \
            flex gcc-aarch64-linux-gnu git libelf-dev liblz4-tool \
            libncurses-dev libssl-dev patch python3 rsync subversion \
            xz-utils zstd

      - name: Build the exact RA72 kernel inside the native DD-WRT tree
        run: bash scripts/port-phase32.sh

      - name: Upload Phase 32 review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddwrt-ra72-phase32-in-tree-kernel-image-build
          path: phase32-output/
          if-no-files-found: warn
          retention-days: 30
