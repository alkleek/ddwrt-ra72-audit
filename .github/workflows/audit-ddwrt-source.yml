name: Audit DD-WRT source for Xiaomi Mi AIoT AX6000 RA72

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Source feasibility audit
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out audit project
        uses: actions/checkout@v4

      - name: Install audit tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends subversion

      - name: Audit public DD-WRT source
        env:
          DDWRT_HTTPS_URL: https://svn.dd-wrt.com/DD-WRT
          DDWRT_SVN_URL: svn://svn.dd-wrt.com/DD-WRT
        run: bash scripts/audit.sh

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddwrt-ra72-source-audit
          path: audit-output/
          if-no-files-found: error
          retention-days: 30
