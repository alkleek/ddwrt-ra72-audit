name: "Phase 18: Strictly classify DD-WRT support for Xiaomi Mi AIoT AX6000 RA72"

on:
  workflow_dispatch:
    inputs:
      ddwrt_source_url:
        description: "Public DD-WRT SVN source URL to audit"
        required: true
        default: "svn://svn.dd-wrt.com/DD-WRT"
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: "Phase 18 strict RA72 classification"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DDWRT_SOURCE_URL: ${{ inputs.ddwrt_source_url }}

    steps:
      - name: Check out audit project
        uses: actions/checkout@v4

      - name: Install audit tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends subversion python3

      - name: Strictly classify public DD-WRT source
        run: bash scripts/audit-phase18.sh

      - name: Upload Phase 18 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddwrt-ra72-phase18-strict-classification
          path: phase18-output/
          if-no-files-found: error
          retention-days: 14
