name: "Phase 20: Map DD-WRT IPQ5018 platform integration for RA72"

on:
  workflow_dispatch:
    inputs:
      ddwrt_source_url:
        description: "Public DD-WRT SVN source URL to audit"
        required: true
        default: "svn://svn.dd-wrt.com/DD-WRT"
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: "Phase 20 IPQ5018 platform integration map"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DDWRT_SOURCE_URL: ${{ inputs.ddwrt_source_url }}

    steps:
      - name: Check out audit project
        uses: actions/checkout@v4

      - name: Install audit tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends subversion python3

      - name: Map the closest DD-WRT platform integration
        run: bash scripts/audit-phase20.sh

      - name: Upload Phase 20 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddwrt-ra72-phase20-platform-integration-map
          path: phase20-output/
          if-no-files-found: warn
          retention-days: 30
