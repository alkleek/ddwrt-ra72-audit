name: Define safe boot-only DD-WRT prototype contract for RA72

on:
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: Verified OpenWrt ref for the working RA72 baseline
        required: true
        default: openwrt-25.12
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: Phase 7 boot-only prototype contract
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out audit project
        uses: actions/checkout@v4

      - name: Install audit tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends git subversion

      - name: Define non-flashable prototype contract
        env:
          DDWRT_HTTPS_URL: https://svn.dd-wrt.com/DD-WRT
          DDWRT_SVN_URL: svn://svn.dd-wrt.com/DD-WRT
          OPENWRT_REPOSITORY: https://github.com/openwrt/openwrt.git
          OPENWRT_REF: ${{ inputs.openwrt_ref }}
        run: bash scripts/audit-phase7.sh

      - name: Upload phase 7 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddwrt-ra72-phase7-boot-contract
          path: phase7-output/
          if-no-files-found: error
          retention-days: 30
