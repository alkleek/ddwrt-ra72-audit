name: "Phase 14: Audit IPQ5018 platform gap and source-import plan for RA72"

on:
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: OpenWrt branch, tag, or commit to inspect
        required: true
        default: openwrt-25.12
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: Phase 14 IPQ5018 platform gap audit
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out audit project
        uses: actions/checkout@v5

      - name: Install audit tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends git subversion ripgrep python3

      - name: Audit platform gap and create source-import plan
        env:
          OPENWRT_REF: ${{ inputs.openwrt_ref }}
        run: bash scripts/audit-phase14.sh

      - name: Upload Phase 14 report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ddwrt-ra72-phase14-platform-gap
          path: phase14-output/
          retention-days: 14
